# LewLM via Docker Compose -- the promoted way to run LewLM on non-Apple hosts.
#
# CPU (default):
#   docker compose up --build
#
# NVIDIA GPU (same service, CUDA image layered on by docker-compose.gpu.yml):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# There is exactly one LewLM service, so the CPU and GPU images can never run
# side by side in this project: they would contend for the same host port and
# the same SQLite registry in `lewlm-data`.
#
# Settings come from a `.env` file next to this one; copy `.env.example` and
# edit it. Every value below has a working default, so `docker compose up`
# succeeds on a fresh clone without one.
#
# Registry state (metadata.sqlite3, cache, logs) lives in the named volume
# `lewlm-data` at /data, which is a native Linux filesystem inside the VM --
# SQLite is not reliable over a bind-mounted host filesystem. The model tree is
# bind-mounted separately at /data/models, read-only, so an existing model
# directory is served in place rather than copied. Docker resolves the deeper
# mount first, so the two coexist.
#
# `lewlm convert` writes to /data/cache/conversions inside the named volume,
# not into the model tree, so the read-only mount above does not block it.
# Uncomment the conversions bind mount to land converted GGUFs on the host
# instead.

services:
  lewlm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # bridge | serving | full. `full` (default) is serving + HF->GGUF
        # conversion + documents; `serving` is the lean GGUF runtime image.
        IMAGE_FLAVOR: "${LEWLM_DOCKER_IMAGE_FLAVOR:-full}"
        # Extra pyproject extras layered on top of the flavor (legacy knob).
        EXTRAS: "${LEWLM_DOCKER_EXTRAS:-}"
        # Pinned llama.cpp revision for the bundled HF->GGUF conversion tools.
        LLAMA_CPP_REF: "${LEWLM_DOCKER_LLAMA_CPP_REF:-b10698}"
        # Set to `disabled` for a lean image without the conversion tools.
        CONVERSION_TOOLS: "${LEWLM_DOCKER_CONVERSION_TOOLS:-enabled}"
        # Parallel native compile jobs; raise on a large build host.
        BUILD_JOBS: "${LEWLM_DOCKER_BUILD_JOBS:-4}"
        # Optional prebuilt llama-cpp-python wheel index (skips the source build).
        LLAMA_CPP_PYTHON_WHEEL_INDEX: "${LEWLM_DOCKER_LLAMA_CPP_PYTHON_WHEEL_INDEX:-}"
        # Optional pinned lock from scripts/docker/lock_dependencies.sh.
        DEPENDENCY_INPUT: "${LEWLM_DOCKER_DEPENDENCY_INPUT:-requirements/${LEWLM_DOCKER_IMAGE_FLAVOR:-full}.txt}"
    image: lewlm:cpu
    ports:
      - "${LEWLM_DOCKER_PORT:-8080}:8080"
    environment:
      LEWLM_HOST: "0.0.0.0"
      LEWLM_PORT: "8080"
      LEWLM_DATA_DIR: "/data"
      # Uncomment to front a local OpenAI-compatible server (e.g. LM Studio on
      # the host) via the external-accelerator bridge:
      # LEWLM_EXTERNAL_ACCELERATOR_ENABLED: "true"
      # LEWLM_EXTERNAL_ACCELERATOR_BASE_URL: "http://host.docker.internal:1234"
    volumes:
      - lewlm-data:/data
      - type: bind
        source: ${LEWLM_DOCKER_MODELS_DIR:-./models}
        target: /data/models
        read_only: true
      # - type: bind
      #   source: ${LEWLM_DOCKER_CONVERSIONS_DIR:-./conversions}
      #   target: /data/cache/conversions
    restart: unless-stopped

volumes:
  lewlm-data:
